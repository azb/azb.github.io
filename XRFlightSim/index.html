<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>XRFlightSim - WebXR Demo</title>
    <link rel="stylesheet" href="./src/style.css?v=0.5.13" />
    <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <section id="hud">
      <p id="speed">Speed 30</p>
      <p id="throttle">Throttle 0%</p>
      <p id="status">Try controls · arrows/WASD · X/Z throttle</p>
      <p id="model">Fighter model: preparing...</p>
      <p id="controllers">Sticks: waiting for XR controllers</p>
      <p id="mp-hud">Multiplayer: solo</p>
      <p>Build 0.5.13</p>
    </section>
    <section id="overlay">
      <h1>XRFlightSim</h1>
      <p>WebXR flight-controls prototype.</p>
      <p class="build">Build 0.5.13 - WebSocket pose relay</p>
      <div class="mp-row">
        <button type="button" id="mp-host">Host</button>
        <input id="mp-code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="1234" autocomplete="off" spellcheck="false" />
        <button type="button" id="mp-join">Join</button>
        <button type="button" id="mp-leave" disabled>Leave</button>
      </div>
      <p id="mp-status" class="mp-status">Multiplayer: solo</p>
      <button id="enter-vr">Checking VR support...</button><button id="reset">Reset flight</button>
    </section>
    <script type="module" src="./src/main.js?v=0.5.13"></script>
  </body>
</html>
